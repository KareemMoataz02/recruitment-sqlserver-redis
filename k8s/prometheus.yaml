apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: recruitment
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: recruitment
spec:
  type: NodePort
  selector: {app: recruitment-prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090, nodePort: 30091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: recruitment
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: recruitment-prometheus}
  template:
    metadata:
      labels: {app: recruitment-prometheus}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: localhost/recruitment-prometheus:20261028
          imagePullPolicy: Never
          args: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            periodSeconds: 15
      volumes:
        - name: config
          configMap: {name: recruitment-prometheus}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
